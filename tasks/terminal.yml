- name: Install Kitty Terminal
  become: true
  apt: 
    name: [ "kitty" ]
  tags:
    - install
    - terminal
    - kitty

- name: Make Kitty default terminal
  become: true
  shell: "update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator `which kitty` 50"
  tags:
    - install
    - terminal
    - kitty

- name: Install ImageMagick
  become: true
  apt: 
    name: [ "imagemagick" ]
  tags:
    - install
    - terminal
    - kitty
