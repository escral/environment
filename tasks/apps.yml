- name: Add VSCode GPG key
  become: true
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
    chmod a+r /etc/apt/keyrings/microsoft.gpg
  args:
    creates: /etc/apt/keyrings/microsoft.gpg
  tags:
    - install
    - apps
    - vscode

- name: Add VSCode apt repository
  become: true
  shell: |
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
      > /etc/apt/sources.list.d/vscode.list
    apt-get update
  args:
    creates: /etc/apt/sources.list.d/vscode.list
  tags:
    - install
    - apps
    - vscode

- name: Install VSCode
  become: true
  apt:
    name: code
  tags:
    - install
    - apps
    - vscode

- name: Install Chrome
  become: true
  shell: "curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb && apt install -y /tmp/chrome.deb && rm -f /tmp/chrome.deb"
  args:
    creates: /usr/bin/google-chrome-stable
  tags:
    - install
    - apps
    - chrome

- name: Install Cursor
  become: true
  shell: |
    curl -fsSL "https://api2.cursor.sh/updates/download/golden/linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}-deb/cursor/{{ cursor_version | default('2.5') }}" -o /tmp/cursor.deb
    apt install -y /tmp/cursor.deb
    rm -f /tmp/cursor.deb
  args:
    creates: /usr/bin/cursor
  tags:
    - install
    - apps
    - cursor
