- name: Get Packer
  ansible.builtin.git:
    repo: 'https://github.com/wbthomason/packer.nvim'
    dest: "{{ lookup('env', 'HOME') }}/.local/share/nvim/site/pack/packer/start/packer.nvim"
  tags:
    - install
    - neovim

- name: Add Neovim PPA
  become: true
  shell: |
    add-apt-repository -y ppa:neovim-ppa/stable
    apt-get update
  args:
    creates: /etc/apt/sources.list.d/neovim-ppa-ubuntu-stable-*.list
  tags:
    - install
    - neovim

- name: Install Neovim
  become: true
  apt:
    name: neovim
  tags:
    - install
    - neovim

